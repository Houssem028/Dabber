<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Ajouter une annonce - Dabber</title>

  <meta name="theme-color" content="#111111">
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="logo.png">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #111;
    }

    .app {
      max-width: 600px;
      min-height: 100vh;
      margin: auto;
      background: white;
      padding-bottom: 30px;
    }

    /* HEADER */

    header {
      height: 65px;
      display: flex;
      align-items: center;
      padding: 0 18px;
      border-bottom: 1px solid #eee;
      position: sticky;
      top: 0;
      background: white;
      z-index: 10;
    }

    .back {
      border: none;
      background: #f2f2f2;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      font-size: 20px;
      cursor: pointer;
      margin-right: 12px;
    }

    header h1 {
      font-size: 20px;
    }

    /* CONTENT */

    .content {
      padding: 20px 18px;
    }

    .intro {
      margin-bottom: 22px;
    }

    .intro h2 {
      font-size: 24px;
      margin-bottom: 7px;
    }

    .intro p {
      color: #777;
      font-size: 14px;
      line-height: 1.5;
    }

    /* FORM */

    .form-group {
      margin-bottom: 18px;
    }

    label {
      display: block;
      font-weight: bold;
      font-size: 14px;
      margin-bottom: 8px;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #ddd;
      background: #fafafa;
      border-radius: 13px;
      padding: 14px;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #111;
      background: white;
    }

    textarea {
      min-height: 120px;
      resize: vertical;
      line-height: 1.5;
    }

    /* PHOTO */

    .photo-box {
      border: 2px dashed #ccc;
      border-radius: 16px;
      min-height: 180px;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      cursor: pointer;
      overflow: hidden;
      background: #fafafa;
      position: relative;
    }

    .photo-box:hover {
      border-color: #111;
    }

    .photo-icon {
      font-size: 45px;
      margin-bottom: 8px;
    }

    .photo-text {
      color: #777;
      font-size: 14px;
      text-align: center;
    }

    #imagePreview {
      width: 100%;
      max-height: 280px;
      object-fit: cover;
      display: none;
    }

    #imageInput {
      display: none;
    }

    .change-photo {
      display: none;
      margin-top: 10px;
      border: none;
      background: #111;
      color: white;
      padding: 9px 15px;
      border-radius: 20px;
      cursor: pointer;
    }

    /* PRICE */

    .price-row {
      display: grid;
      grid-template-columns: 1fr 130px;
      gap: 10px;
    }

    /* BUTTON */

    .publish {
      width: 100%;
      height: 54px;
      border: none;
      border-radius: 15px;
      background: #111;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 8px;
    }

    .publish:active {
      transform: scale(0.98);
    }

    /* MESSAGE */

    .success {
      display: none;
      background: #e9f8ed;
      color: #176b2c;
      padding: 15px;
      border-radius: 13px;
      margin-bottom: 18px;
      line-height: 1.5;
      font-size: 14px;
    }

    .error {
      display: none;
      background: #fff0f0;
      color: #b00020;
      padding: 13px;
      border-radius: 13px;
      margin-bottom: 18px;
      font-size: 14px;
    }

    /* ARABIC */

    body.arabic {
      direction: rtl;
    }

    body.arabic .back {
      margin-right: 0;
      margin-left: 12px;
    }

    /* DESKTOP */

    @media (min-width: 601px) {
      body {
        background: #e9e9e9;
      }

      .app {
        box-shadow: 0 0 30px rgba(0,0,0,0.08);
      }
    }
  </style>
</head>

<body>

<div class="app">

  <!-- HEADER -->

  <header>

    <button class="back" onclick="goBack()">
      ←
    </button>

    <h1 id="headerTitle">
      Ajouter une annonce
    </h1>

  </header>


  <main class="content">

    <!-- INTRO -->

    <div class="intro">

      <h2 id="pageTitle">
        Publiez votre annonce
      </h2>

      <p id="pageText">
        Présentez votre objet à louer et trouvez rapidement des locataires.
      </p>

    </div>


    <!-- SUCCESS -->

    <div class="success" id="successMessage">
      ✅ Votre annonce a été publiée avec succès !
    </div>


    <!-- ERROR -->

    <div class="error" id="errorMessage">
      ⚠️ Veuillez remplir tous les champs obligatoires.
    </div>


    <!-- PHOTO -->

    <div class="form-group">

      <label id="photoLabel">
        Photo de l'annonce
      </label>

      <div
        class="photo-box"
        onclick="openImagePicker()"
        id="photoBox"
      >

        <div id="photoContent">

          <div class="photo-icon">
            📷
          </div>

          <div class="photo-text" id="photoText">
            Ajouter une photo
            <br>
            Touchez ici pour choisir une image
          </div>

        </div>

        <img
          id="imagePreview"
          alt="Aperçu"
        >

      </div>

      <input
        type="file"
        id="imageInput"
        accept="image/*"
        onchange="previewImage(event)"
      >

      <button
        class="change-photo"
        id="changePhoto"
        onclick="openImagePicker()"
      >
        Changer la photo
      </button>

    </div>


    <!-- NAME -->

    <div class="form-group">

      <label for="title" id="titleLabel">
        Nom de l'objet *
      </label>

      <input
        type="text"
        id="title"
        placeholder="Ex : Appareil photo Canon"
        maxlength="80"
      >

    </div>


    <!-- CATEGORY -->

    <div class="form-group">

      <label for="category" id="categoryLabel">
        Catégorie *
      </label>

      <select id="category">

        <option value="">
          Choisir une catégorie
        </option>

        <option value="Véhicules">
          🚗 Véhicules
        </option>

        <option value="Maison">
          🏠 Maison
        </option>

        <option value="Événements">
          🎉 Événements
        </option>

        <option value="Outils">
          🔧 Outils
        </option>

        <option value="Électronique">
          📱 Électronique
        </option>

        <option value="Mode">
          👗 Mode
        </option>

        <option value="Autres">
          📦 Autres
        </option>

      </select>

    </div>


    <!-- PRICE -->

    <div class="form-group">

      <label id="priceLabel">
        Prix *
      </label>

      <div class="price-row">

        <input
          type="number"
          id="price"
          min="0"
          placeholder="Ex : 50"
        >

        <select id="period">

          <option value="jour">
            / jour
          </option>

          <option value="semaine">
            / semaine
          </option>

          <option value="mois">
            / mois
          </option>

        </select>

      </div>

    </div>


    <!-- CITY -->

    <div class="form-group">

      <label for="city" id="cityLabel">
        Ville *
      </label>

      <select id="city">

        <option value="">
          Choisir une ville
        </option>

        <option>Tunis</option>
        <option>Ariana</option>
        <option>Ben Arous</option>
        <option>Manouba</option>
        <option>Nabeul</option>
        <option>Sousse</option>
        <option>Monastir</option>
        <option>Mahdia</option>
        <option>Sfax</option>
        <option>Bizerte</option>
        <option>Gabès</option>
        <option>Djerba</option>
        <option>Kairouan</option>
        <option>Gafsa</option>
        <option>Tozeur</option>
        <option>Autre</option>

      </select>

    </div>


    <!-- DESCRIPTION -->

    <div class="form-group">

      <label for="description" id="descriptionLabel">
        Description *
      </label>

      <textarea
        id="description"
        maxlength="1000"
        placeholder="Décrivez votre objet, son état, les conditions de location..."
      ></textarea>

    </div>


    <!-- PUBLISH -->

    <button
      class="publish"
      onclick="publishAnnonce()"
      id="publishButton"
    >
      Publier l'annonce
    </button>

  </main>

</div>


<script>

  let selectedImage = "";


  /* IMAGE */

  function openImagePicker() {
    document.getElementById("imageInput").click();
  }


  function previewImage(event) {

    const file = event.target.files[0];

    if (!file) return;

    const reader = new FileReader();

    reader.onload = function(e) {

      selectedImage = e.target.result;

      const preview =
        document.getElementById("imagePreview");

      preview.src = selectedImage;

      preview.style.display = "block";

      document.getElementById("photoContent")
        .style.display = "none";

      document.getElementById("changePhoto")
        .style.display = "inline-block";

    };

    reader.readAsDataURL(file);

  }


  /* PUBLISH */

  function publishAnnonce() {

    const title =
      document.getElementById("title").value.trim();

    const category =
      document.getElementById("category").value;

    const price =
      document.getElementById("price").value;

    const period =
      document.getElementById("period").value;

    const city =
      document.getElementById("city").value;

    const description =
      document.getElementById("description").value.trim();


    /* VALIDATION */

    if (
      !title ||
      !category ||
      !price ||
      !city ||
      !description
    ) {

      document.getElementById("errorMessage")
        .style.display = "block";

      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

      return;
    }


    document.getElementById("errorMessage")
      .style.display = "none";


    /* ANNONCE */

    const annonce = {

      id: Date.now(),

      title: title,

      category: category,

      price: price,

      period: period,

      city: city,

      description: description,

      image: selectedImage,

      date: new Date().toISOString()

    };


    /* GET OLD ADS */

    let annonces =
      JSON.parse(
        localStorage.getItem("dabber_annonces")
      ) || [];


    /* ADD NEW */

    annonces.unshift(annonce);


    /* SAVE */

    localStorage.setItem(
      "dabber_annonces",
      JSON.stringify(annonces)
    );


    /* SUCCESS */

    document.getElementById("successMessage")
      .style.display = "block";


    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });


    /* RESET */

    setTimeout(function() {

      window.location.href = "index.html";

    }, 1500);

  }


  /* BACK */

  function goBack() {

    if (document.referrer) {

      history.back();

    } else {

      window.location.href = "index.html";

    }

  }


  /* LANGUAGE */

  let isArabic = false;


  function toggleLanguage() {

    isArabic = !isArabic;

  }

</script>

</body>
</html>
