<!DOCTYPE html>
<html lang="fr" dir="ltr">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <meta name="theme-color"
        content="#0b2d68">

  <title>Dabber - Ajouter une annonce</title>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #111827;
      padding-bottom: 30px;
    }

    header {
      background: #0b2d68;
      color: white;
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 10;
    }

    header img {
      width: 100px;
      max-height: 50px;
      object-fit: contain;
    }

    .back {
      background: white;
      color: #0b2d68;
      border: 0;
      padding: 10px 15px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .container {
      max-width: 650px;
      margin: 25px auto;
      padding: 0 15px;
    }

    .title {
      text-align: center;
      margin-bottom: 25px;
    }

    .title h1 {
      margin-bottom: 8px;
      color: #0b2d68;
    }

    .title p {
      color: #667085;
    }

    .form {
      background: white;
      padding: 22px;
      border-radius: 18px;
      box-shadow: 0 5px 20px rgba(0,0,0,.08);
    }

    .field {
      margin-bottom: 18px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      font-weight: bold;
    }

    input,
    select,
    textarea {
      width: 100%;
      border: 1px solid #d0d5dd;
      border-radius: 12px;
      padding: 13px;
      font-size: 16px;
      outline: none;
      background: white;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #0b2d68;
    }

    textarea {
      min-height: 110px;
      resize: vertical;
    }

    .price-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .image-preview {
      margin-top: 10px;
      display: none;
      width: 100%;
      max-height: 250px;
      object-fit: cover;
      border-radius: 12px;
    }

    .submit {
      width: 100%;
      background: #0b2d68;
      color: white;
      border: 0;
      padding: 15px;
      border-radius: 12px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 5px;
    }

    .submit:active {
      transform: scale(.98);
    }

    .message {
      display: none;
      padding: 13px;
      border-radius: 12px;
      margin-bottom: 18px;
      text-align: center;
      font-weight: bold;
    }

    .success {
      background: #dcfce7;
      color: #166534;
    }

    .error {
      background: #fee2e2;
      color: #991b1b;
    }

    @media(max-width:600px) {

      .price-row {
        grid-template-columns: 1fr;
      }

      .form {
        padding: 18px;
      }

    }

  </style>

</head>


<body>


<header>

  <img
    src="logo.png"
    alt="Dabber">

  <button
    class="back"
    id="backBtn"
    type="button">

    ← Accueil

  </button>

</header>


<div class="container">


  <div class="title">

    <h1 id="pageTitle">
      Ajouter une annonce
    </h1>

    <p id="pageDescription">
      Publiez votre objet ou service à louer.
    </p>

  </div>


  <div
    id="message"
    class="message">
  </div>


  <form
    class="form"
    id="listingForm">


    <!-- TITLE -->

    <div class="field">

      <label id="titleLabel">
        Titre de l'annonce
      </label>

      <input
        id="title"
        type="text"
        placeholder="Ex: Appartement moderne"
        required>

    </div>


    <!-- CATEGORY -->

    <div class="field">

      <label id="categoryLabel">
        Catégorie
      </label>

      <select
        id="category"
        required>

        <option value="">
          Choisir une catégorie
        </option>

        <option value="Maison">
          🏠 Maison
        </option>

        <option value="Véhicules">
          🚗 Véhicules
        </option>

        <option value="Meubles">
          🛋️ Meubles
        </option>

        <option value="Outils">
          🛠️ Outils
        </option>

        <option value="Électronique">
          📱 Électronique
        </option>

        <option value="Événements">
          🎉 Événements
        </option>

        <option value="Mode">
          👗 Mode
        </option>

        <option value="Autres">
          📦 Autres
        </option>

      </select>

    </div>


    <!-- CITY -->

    <div class="field">

      <label id="cityLabel">
        Ville
      </label>

      <input
        id="city"
        type="text"
        placeholder="Ex: Tunis"
        required>

    </div>


    <!-- PRICE -->

    <div class="price-row">


      <div class="field">

        <label id="priceLabel">
          Prix
        </label>

        <input
          id="price"
          type="number"
          min="0"
          step="1"
          placeholder="80"
          required>

      </div>


      <div class="field">

        <label id="periodLabel">
          Période
        </label>

        <select
          id="period"
          required>

          <option value="jour">
            Par jour
          </option>

          <option value="nuit">
            Par nuit
          </option>

          <option value="semaine">
            Par semaine
          </option>

          <option value="mois">
            Par mois
          </option>

        </select>

      </div>


    </div>


    <!-- DESCRIPTION -->

    <div class="field">

      <label id="descriptionLabel">
        Description
      </label>

      <textarea
        id="description"
        placeholder="Décrivez votre annonce...">
      </textarea>

    </div>


    <!-- IMAGE -->

    <div class="field">

      <label id="imageLabel">
        Photo
      </label>

      <input
        id="image"
        type="file"
        accept="image/*">

      <img
        id="imagePreview"
        class="image-preview"
        alt="Aperçu">

    </div>


    <button
      class="submit"
      type="submit"
      id="submitBtn">

      Publier l'annonce

    </button>


  </form>

</div>


<script>


/* =====================================================
   LANGUAGE
===================================================== */

let arabic =
  localStorage.getItem("dabberLang") === "ar";


function updateLanguage() {

  document.documentElement.lang =
    arabic ? "ar" : "fr";

  document.documentElement.dir =
    arabic ? "rtl" : "ltr";


  document.getElementById("pageTitle").textContent =
    arabic
      ? "إضافة إعلان"
      : "Ajouter une annonce";


  document.getElementById("pageDescription").textContent =
    arabic
      ? "انشر الشيء أو الخدمة التي تريد كرائها."
      : "Publiez votre objet ou service à louer.";


  document.getElementById("titleLabel").textContent =
    arabic
      ? "عنوان الإعلان"
      : "Titre de l'annonce";


  document.getElementById("categoryLabel").textContent =
    arabic
      ? "التصنيف"
      : "Catégorie";


  document.getElementById("cityLabel").textContent =
    arabic
      ? "المدينة"
      : "Ville";


  document.getElementById("priceLabel").textContent =
    arabic
      ? "السعر"
      : "Prix";


  document.getElementById("periodLabel").textContent =
    arabic
      ? "المدة"
      : "Période";


  document.getElementById("descriptionLabel").textContent =
    arabic
      ? "الوصف"
      : "Description";


  document.getElementById("imageLabel").textContent =
    arabic
      ? "الصورة"
      : "Photo";


  document.getElementById("submitBtn").textContent =
    arabic
      ? "نشر الإعلان"
      : "Publier l'annonce";


  document.getElementById("backBtn").textContent =
    arabic
      ? "← الرئيسية"
      : "← Accueil";

}


updateLanguage();


/* =====================================================
   BACK
===================================================== */

document
  .getElementById("backBtn")
  .onclick = function() {

    window.location.href =
      "index.html";

  };


/* =====================================================
   IMAGE PREVIEW
===================================================== */

document
  .getElementById("image")
  .addEventListener(
    "change",
    function(event) {

      const file =
        event.target.files[0];

      const preview =
        document.getElementById(
          "imagePreview"
        );


      if (!file) {

        preview.style.display =
          "none";

        return;

      }


      const reader =
        new FileReader();


      reader.onload = function(e) {

        preview.src =
          e.target.result;

        preview.style.display =
          "block";

      };


      reader.readAsDataURL(file);

    }
  );


/* =====================================================
   SAVE LISTING
===================================================== */

document
  .getElementById("listingForm")
  .addEventListener(
    "submit",
    function(event) {

      event.preventDefault();


      const title =
        document.getElementById(
          "title"
        ).value.trim();


      const category =
        document.getElementById(
          "category"
        ).value;


      const city =
        document.getElementById(
          "city"
        ).value.trim();


      const price =
        document.getElementById(
          "price"
        ).value;


      const period =
        document.getElementById(
          "period"
        ).value;


      const description =
        document.getElementById(
          "description"
        ).value.trim();


      const imageInput =
        document.getElementById(
          "image"
        );


      if (
        !title ||
        !category ||
        !city ||
        !price ||
        !period
      ) {

        showMessage(
          arabic
            ? "يرجى ملء جميع الخانات المطلوبة."
            : "Veuillez remplir tous les champs obligatoires.",
          "error"
        );

        return;

      }


      function save(imageData) {

        const old =
          localStorage.getItem(
            "dabber_annonces"
          );


        let annonces = [];


        try {

          annonces =
            old
              ? JSON.parse(old)
              : [];

          if (!Array.isArray(annonces)) {
            annonces = [];
          }

        } catch {

          annonces = [];

        }


        const annonce = {

          id:
            "ad_" +
            Date.now() +
            "_" +
            Math.random()
              .toString(36)
              .substring(2, 8),

          title:
            title,

          category:
            category,

          city:
            city,

          price:
            price,

          period:
            period,

          description:
            description,

          image:
            imageData || "",

          createdAt:
            new Date().toISOString()

        };


        annonces.unshift(
          annonce
        );


        try {

          localStorage.setItem(
            "dabber_annonces",
            JSON.stringify(annonces)
          );


          showMessage(
            arabic
              ? "تم نشر الإعلان بنجاح 🎉"
              : "Annonce publiée avec succès 🎉",
            "success"
          );


          document
            .getElementById(
              "listingForm"
            )
            .reset();


          document
            .getElementById(
              "imagePreview"
            )
            .style.display =
              "none";


          setTimeout(
            function() {

              window.location.href =
                "index.html";

            },
            1000
          );


        } catch(error) {

          showMessage(
            arabic
              ? "الصورة كبيرة جدًا. جرّب صورة أصغر."
              : "L'image est trop grande. Essayez une image plus petite.",
            "error"
          );

        }

      }


      if (
        imageInput.files &&
        imageInput.files[0]
      ) {

        const reader =
          new FileReader();


        reader.onload = function(e) {

          save(e.target.result);

        };


        reader.readAsDataURL(
          imageInput.files[0]
        );

      }

      else {

        save("");

      }

    }
  );


/* =====================================================
   MESSAGE
===================================================== */

function showMessage(
  text,
  type
) {

  const box =
    document.getElementById(
      "message"
    );


  box.textContent =
    text;


  box.className =
    "message " + type;


  box.style.display =
    "block";


  window.scrollTo({

    top: 0,

    behavior: "smooth"

  });

}

</script>

</body>
  </html>
