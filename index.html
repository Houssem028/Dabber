<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dabber</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;
      color: #111827;
    }

    header {
      background: #0b2d68;
      padding: 15px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    header img {
      width: 100px;
      max-height: 50px;
      object-fit: contain;
    }

    button {
      border: 0;
      cursor: pointer;
    }

    #langBtn {
      background: white;
      padding: 10px 15px;
      border-radius: 20px;
    }

    .hero {
      background: linear-gradient(135deg, #0b2d68, #1769aa);
      color: white;
      padding: 50px 20px;
      text-align: center;
    }

    .hero h1 {
      font-size: 32px;
      margin: 15px 0;
    }

    .hero p {
      max-width: 600px;
      margin: auto;
      line-height: 1.6;
    }

    .search {
      max-width: 600px;
      margin: 25px auto 10px;
      background: white;
      border-radius: 30px;
      padding: 6px;
      display: flex;
    }

    .search input {
      flex: 1;
      border: 0;
      outline: 0;
      padding: 12px;
      font-size: 16px;
    }

    .search button {
      background: #0b2d68;
      color: white;
      width: 45px;
      height: 45px;
      border-radius: 50%;
    }

    .section {
      padding: 25px 15px;
      max-width: 1100px;
      margin: auto;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    .categories {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .cat {
      background: white;
      padding: 20px 10px;
      border-radius: 15px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
      font-size: 15px;
    }

    .cat span {
      display: block;
      font-size: 30px;
      margin-bottom: 8px;
    }

    .listings {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border-radius: 15px;
      overflow: hidden;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    .card-image {
      height: 150px;
      background: #e9eef7;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 55px;
    }

    .card-body {
      padding: 15px;
    }

    .card-body h3 {
      margin: 8px 0;
    }

    .card-body p {
      color: #667085;
    }

    .tag {
      display: inline-block;
      background: #e7efff;
      color: #0b2d68;
      padding: 5px 9px;
      border-radius: 10px;
      font-size: 12px;
    }

    .bottom {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: white;
      border-top: 1px solid #ddd;
      display: flex;
      justify-content: space-around;
      padding: 10px;
    }

    .bottom button {
      background: none;
      font-size: 13px;
    }

    .bottom span {
      display: block;
      font-size: 22px;
    }

    @media(max-width:700px) {

      .categories {
        grid-template-columns: repeat(2, 1fr);
      }

      .listings {
        grid-template-columns: repeat(2, 1fr);
      }

      .hero h1 {
        font-size: 25px;
      }

    }
  </style>
</head>

<body>

<header>

  <img src="logo.png" alt="Dabber">

  <button id="langBtn">
    العربية 🇹🇳
  </button>

</header>


<section class="hero">

  <div id="eyebrow">
    Trouvez • Louez • Profitez
  </div>

  <h1 id="title">
    Tout ce dont vous avez besoin, à louer.
  </h1>

  <p id="description">
    Trouvez facilement des logements, voitures, équipements et bien plus près de chez vous.
  </p>

  <div class="search">

    <input
      id="searchInput"
      type="search"
      placeholder="Que cherchez-vous à louer ?">

    <button id="searchBtn">
      🔍
    </button>

  </div>

  <div>
    📍 Près de vous • Tunis
  </div>

</section>


<section class="section">

  <h2 id="categoriesTitle">
    Catégories
  </h2>

  <div
    class="categories"
    id="categories">
  </div>

</section>


<section class="section">

  <h2 id="listingsTitle">
    Annonces populaires
  </h2>

  <div
    class="listings"
    id="listings">
  </div>

</section>


<nav class="bottom">

  <button>
    <span>⌂</span>
    Accueil
  </button>

  <button id="bottomSearch">
    <span>⌕</span>
    Recherche
  </button>

  <button id="addBtn">
    <span>＋</span>
    Publier
  </button>

  <button>
    <span>♡</span>
    Favoris
  </button>

  <button>
    <span>♙</span>
    Compte
  </button>

</nav>


<script>

const categories = [

  ["🏠", "Logements", "سكن"],
  ["🚗", "Voitures", "سيارات"],
  ["🛋️", "Meubles", "أثاث"],
  ["🛠️", "Matériel", "معدات"],
  ["📱", "Électronique", "إلكترونيات"],
  ["🎉", "Événementiel", "مناسبات"],
  ["👗", "Mode", "أزياء"],
  ["📦", "Autres", "أخرى"]

];


const listings = [

  ["🏠", "Appartement moderne", "Tunis", "80 DT / nuit", "Logements", "سكن"],

  ["🚗", "SUV confortable", "Tunis", "180 DT / jour", "Voitures", "سيارات"],

  ["🛠️", "Perceuse professionnelle", "Ariana", "25 DT / jour", "Matériel", "معدات"],

  ["🛋️", "Salon complet", "Ben Arous", "50 DT / jour", "Meubles", "أثاث"]

];


let arabic = false;


function showCategories() {

  const box =
    document.getElementById("categories");

  box.innerHTML = "";

  categories.forEach(item => {

    const button =
      document.createElement("button");

    button.className = "cat";

    button.innerHTML = `
      <span>${item[0]}</span>
      <b>${arabic ? item[2] : item[1]}</b>
    `;

    button.onclick = () => {

      document.getElementById("searchInput").value =
        arabic ? item[2] : item[1];

      search();

    };

    box.appendChild(button);

  });

}


function showListings(data = listings) {

  const box =
    document.getElementById("listings");

  box.innerHTML = "";

  data.forEach(item => {

    const card =
      document.createElement("article");

    card.className = "card";

    card.innerHTML = `

      <div class="card-image">
        ${item[0]}
      </div>

      <div class="card-body">

        <div class="tag">
          ${arabic ? item[5] : item[4]}
        </div>

        <h3>
          ${item[1]}
        </h3>

        <p>
          📍 ${item[2]}
        </p>

        <strong>
          ${item[3]}
        </strong>

      </div>

    `;

    box.appendChild(card);

  });

}


function search() {

  const value =
    document
      .getElementById("searchInput")
      .value
      .toLowerCase();

  if (!value) {

    showListings();

    return;

  }

  const result =
    listings.filter(item =>

      item.join(" ")
        .toLowerCase()
        .includes(value)

    );

  showListings(result);

}


document
  .getElementById("searchBtn")
  .onclick = search;


document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    event => {

      if (event.key === "Enter") {
        search();
      }

    }
  );


document
  .getElementById("bottomSearch")
  .onclick = () => {

    document
      .getElementById("searchInput")
      .focus();

    window.scrollTo({
      top: 0,
      behavior: "smooth"
    });

  };


document
  .getElementById("addBtn")
  .onclick = () => {

    window.location.href =
      "ajouter.html";

  };


document
  .getElementById("langBtn")
  .onclick = () => {

    arabic = !arabic;

    document.documentElement.lang =
      arabic ? "ar" : "fr";

    document.documentElement.dir =
      arabic ? "rtl" : "ltr";

    document.getElementById("langBtn").textContent =
      arabic ? "Français 🇫🇷" : "العربية 🇹🇳";

    document.getElementById("eyebrow").textContent =
      arabic
        ? "إبحث • اكري • استمتع"
        : "Trouvez • Louez • Profitez";

    document.getElementById("title").textContent =
      arabic
        ? "كل ما تحتاجه، للكراء."
        : "Tout ce dont vous avez besoin, à louer.";

    document.getElementById("description").textContent =
      arabic
        ? "إلقى بسهولة شقق، سيارات، معدات وحاجات أكثر قريبة ليك."
        : "Trouvez facilement des logements, voitures, équipements et bien plus près de chez vous.";

    document.getElementById("categoriesTitle").textContent =
      arabic ? "التصنيفات" : "Catégories";

    document.getElementById("listingsTitle").textContent =
      arabic ? "إعلانات مميزة" : "Annonces populaires";

    document.getElementById("searchInput").placeholder =
      arabic
        ? "شنوّة تحب تكرّي؟"
        : "Que cherchez-vous à louer ?";

    showCategories();
    showListings();

  };


showCategories();
showListings();

</script>

</body>
</html>
