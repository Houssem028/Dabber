<!doctype html>
<html lang="fr" dir="ltr">

<head>
  <meta charset="utf-8">

  <meta name="viewport"
        content="width=device-width,initial-scale=1,viewport-fit=cover">

  <meta name="theme-color" content="#0b2d68">

  <meta name="description"
        content="Dabber — plateforme de location simple et rapide.">

  <link rel="manifest" href="manifest.json">

  <link rel="icon" href="logo.png">

  <link rel="stylesheet" href="style.css">

  <title>Dabber — Location</title>
</head>

<body>

  <!-- SPLASH -->
  <div id="splash" class="splash">
    <img src="logo.png" alt="Dabber">
  </div>


  <!-- TOPBAR -->
  <header class="topbar">

    <div class="brand">
      <img src="logo.png" alt="Dabber">
    </div>

    <button id="langBtn"
            class="lang-btn"
            type="button">
      العربية 🇹🇳
    </button>

  </header>


  <main>

    <!-- HERO -->
    <section class="hero">

      <div class="hero-content">

        <span class="eyebrow"
              data-fr="Trouvez • Louez • Profitez"
              data-ar="إبحث • اكري • استمتع">
        </span>

        <h1 data-fr="Tout ce dont vous avez besoin, à louer."
            data-ar="كل ما تحتاجه، للكراء.">
        </h1>

        <p data-fr="Trouvez facilement des logements, voitures, équipements et bien plus près de chez vous."
           data-ar="إلقى بسهولة شقق، سيارات، معدات وحاجات أكثر قريبة ليك.">
        </p>


        <!-- SEARCH -->
        <div class="search">

          <span>⌕</span>

          <input
            id="searchInput"
            type="search"
            data-placeholder-fr="Que cherchez-vous à louer ?"
            data-placeholder-ar="شنوّة تحب تكرّي؟"
            placeholder="Que cherchez-vous à louer ?">

          <button id="searchBtn" type="button">
            ⌕
          </button>

        </div>


        <!-- LOCATION -->
        <div class="location">

          ⌖

          <span data-fr="Près de vous"
                data-ar="قريب ليك">
          </span>

          <b>•</b>

          Tunis

        </div>

      </div>

    </section>


    <!-- CATEGORIES -->
    <section class="section">

      <div class="section-head">

        <h2 data-fr="Catégories"
            data-ar="التصنيفات">
        </h2>

        <button
          class="see-all"
          id="seeCategories"
          type="button"
          data-fr="Voir tout"
          data-ar="الكل">
        </button>

      </div>

      <div
        class="categories"
        id="categories">
      </div>

    </section>


    <!-- LISTINGS -->
    <section class="section listings-section">

      <div class="section-head">

        <h2
          id="listingsTitle"
          data-fr="Annonces populaires"
          data-ar="إعلانات مميزة">
        </h2>

        <button
          class="see-all"
          id="showAll"
          type="button"
          data-fr="Plus"
          data-ar="المزيد">
        </button>

      </div>

      <div
        class="listings"
        id="listings">
      </div>

    </section>

  </main>


  <!-- BOTTOM NAV -->
  <nav class="bottom-nav">

    <button
      class="active"
      id="homeBtn"
      type="button">

      <span>⌂</span>

      <small
        data-fr="Accueil"
        data-ar="الرئيسية">
      </small>

    </button>


    <button
      id="bottomSearch"
      type="button">

      <span>⌕</span>

      <small
        data-fr="Recherche"
        data-ar="بحث">
      </small>

    </button>


    <button
      class="add"
      id="addBtn"
      type="button">

      <span>＋</span>

      <small
        data-fr="Publier"
        data-ar="نشر">
      </small>

    </button>


    <button
      id="favoritesBtn"
      type="button">

      <span>♡</span>

      <small
        data-fr="Favoris"
        data-ar="المفضلة">
      </small>

    </button>


    <button
      id="accountBtn"
      type="button">

      <span>♙</span>

      <small
        data-fr="Compte"
        data-ar="حسابي">
      </small>

    </button>

  </nav>


  <!-- INSTALL -->
  <div
    id="installBox"
    class="install-box hidden">

    <div>

      <strong
        data-fr="Installer Dabber"
        data-ar="ثبّت Dabber">
      </strong>

      <span
        data-fr="Ajoutez Dabber à votre écran d’accueil."
        data-ar="أضف Dabber إلى الشاشة الرئيسية.">
      </span>

    </div>

    <button
      id="installBtn"
      type="button">
      ＋
    </button>

  </div>


<script>

/* =====================================================
   LANGUAGE
===================================================== */

const translations = {

  fr: {
    htmlLang: "fr",
    dir: "ltr"
  },

  ar: {
    htmlLang: "ar",
    dir: "rtl"
  }

};


let currentLang =
  localStorage.getItem("dabberLang") || "fr";


/* =====================================================
   CATEGORIES
===================================================== */

const categories = [

  ["🏠", "Logements", "سكن"],

  ["🚗", "Voitures", "سيارات"],

  ["🛋️", "Meubles", "أثاث"],

  ["🛠️", "Matériel", "معدات"],

  ["📱", "Électronique", "إلكترونيات"],

  ["🎉", "Événementiel", "مناسبات"],

  ["👗", "Mode", "أزياء"],

  ["📦", "Autres", "أخرى"]

];


/* =====================================================
   DEMO LISTINGS
===================================================== */

const demoListings = [

  {
    id: "demo1",
    emoji: "🏠",
    title: "Appartement moderne",
    city: "Tunis",
    price: "80 DT",
    period: "nuit",
    category: "Logements",
    categoryAr: "سكن"
  },

  {
    id: "demo2",
    emoji: "🚗",
    title: "SUV confortable",
    city: "Tunis",
    price: "180 DT",
    period: "jour",
    category: "Voitures",
    categoryAr: "سيارات"
  },

  {
    id: "demo3",
    emoji: "🛠️",
    title: "Perceuse professionnelle",
    city: "Ariana",
    price: "25 DT",
    period: "jour",
    category: "Matériel",
    categoryAr: "معدات"
  },

  {
    id: "demo4",
    emoji: "🛋️",
    title: "Salon complet",
    city: "Ben Arous",
    price: "50 DT",
    period: "jour",
    category: "Meubles",
    categoryAr: "أثاث"
  }

];


/* =====================================================
   GET USER LISTINGS
===================================================== */

function getUserListings() {

  try {

    const data =
      localStorage.getItem("dabber_annonces");

    if (!data) return [];

    const parsed =
      JSON.parse(data);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch (error) {

    console.error(error);

    return [];

  }

}


/* =====================================================
   ARABIC CATEGORY
===================================================== */

function getArabicCategory(category) {

  const map = {

    "Véhicules": "سيارات",
    "Maison": "منزل",
    "Événements": "مناسبات",
    "Outils": "معدات",
    "Électronique": "إلكترونيات",
    "Mode": "أزياء",
    "Autres": "أخرى",

    "Logements": "سكن",
    "Voitures": "سيارات",
    "Meubles": "أثاث",
    "Matériel": "معدات",
    "Événementiel": "مناسبات"

  };

  return map[category] || category;

}


/* =====================================================
   CONVERT USER LISTING
===================================================== */

function convertUserListing(ad) {

  let emoji = "📦";

  if (ad.category === "Véhicules") {
    emoji = "🚗";
  }

  if (ad.category === "Maison") {
    emoji = "🏠";
  }

  if (ad.category === "Événements") {
    emoji = "🎉";
  }

  if (ad.category === "Outils") {
    emoji = "🛠️";
  }

  if (ad.category === "Électronique") {
    emoji = "📱";
  }

  if (ad.category === "Mode") {
    emoji = "👗";
  }

  return {

    id: ad.id || Date.now(),

    emoji: emoji,

    title: ad.title || "Annonce",

    city: ad.city || "Tunisie",

    price: (ad.price || "0") + " DT",

    period: ad.period || "jour",

    category: ad.category || "Autres",

    categoryAr:
      getArabicCategory(ad.category || "Autres"),

    image: ad.image || ""

  };

}


/* =====================================================
   ALL LISTINGS
===================================================== */

function getAllListings() {

  const userListings =
    getUserListings()
      .map(convertUserListing);

  return [

    ...userListings,

    ...demoListings

  ];

}


/* =====================================================
   LANGUAGE
===================================================== */

function applyLanguage() {

  document.documentElement.lang =
    translations[currentLang].htmlLang;

  document.documentElement.dir =
    translations[currentLang].dir;


  document
    .querySelectorAll("[data-fr]")
    .forEach(element => {

      element.textContent =
        element.dataset[currentLang];

    });


  const input =
    document.getElementById("searchInput");


  input.placeholder =
    input.dataset[
      "placeholder-" + currentLang
    ];


  document.getElementById("langBtn").textContent =
    currentLang === "fr"
      ? "العربية 🇹🇳"
      : "Français 🇫🇷";


  renderCategories();

  renderListings();

}


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories() {

  const box =
    document.getElementById("categories");


  box.innerHTML =
    categories.map(category => {

      const name =
        currentLang === "fr"
          ? category[1]
          : category[2];


      return `

        <button
          class="cat"
          type="button"
          data-search="${name}">

          <span>
            ${category[0]}
          </span>

          <b>
            ${name}
          </b>

        </button>

      `;

    }).join("");

}


/* =====================================================
   ESCAPE HTML
===================================================== */

function escapeHtml(value) {

  return String(value || "")

    .replace(/&/g, "&amp;")

    .replace(/</g, "&lt;")

    .replace(/>/g, "&gt;")

    .replace(/"/g, "&quot;")

    .replace(/'/g, "&#039;");

}


/* =====================================================
   PERIOD
===================================================== */

function getPeriod(period) {

  if (currentLang === "ar") {

    if (period === "jour")
      return "اليوم";

    if (period === "semaine")
      return "الأسبوع";

    if (period === "mois")
      return "الشهر";

    if (period === "nuit")
      return "الليلة";

  }


  if (period === "jour")
    return "jour";

  if (period === "semaine")
    return "semaine";

  if (period === "mois")
    return "mois";

  if (period === "nuit")
    return "nuit";


  return period || "jour";

}


/* =====================================================
   FAVORITES
===================================================== */

function getFavorites() {

  try {

    const data =
      localStorage.getItem("dabber_favorites");

    if (!data) return [];

    const parsed =
      JSON.parse(data);

    return Array.isArray(parsed)
      ? parsed
      : [];

  } catch {

    return [];

  }

}


function isFavorite(id) {

  return getFavorites()
    .includes(String(id));

}


function toggleFavorite(event, id) {

  event.stopPropagation();


  let favorites =
    getFavorites();


  id = String(id);


  if (favorites.includes(id)) {

    favorites =
      favorites.filter(
        item => item !== id
      );

  } else {

    favorites.push(id);

  }


  localStorage.setItem(
    "dabber_favorites",
    JSON.stringify(favorites)
  );


  renderListings(
    document.getElementById("searchInput").value
  );

}


/* =====================================================
   RENDER LISTINGS
===================================================== */

function renderListings(filter = "") {

  const box =
    document.getElementById("listings");


  const all =
    getAllListings();


  const search =
    String(filter)
      .toLowerCase()
      .trim();


  const results =
    all.filter(ad => {

      if (!search) return true;


      return (

        String(ad.title)
          .toLowerCase()
          .includes(search)

        ||

        String(ad.city)
          .toLowerCase()
          .includes(search)

        ||

        String(ad.category)
          .toLowerCase()
          .includes(search)

        ||

        String(ad.categoryAr)
          .toLowerCase()
          .includes(search)

      );

    });


  if (!results.length) {

    box.innerHTML = `

      <div class="empty">

        ${
          currentLang === "fr"
          ? "Aucune annonce trouvée."
          : "ما لقيناش إعلانات."
        }

      </div>

    `;

    return;

  }


  box.innerHTML =
    results.map(ad => {

      const category =
        currentLang === "fr"
          ? ad.category
          : ad.categoryAr;


      const favorite =
        isFavorite(ad.id);


      const image =
        ad.image
          ? `

            <img
              src="${ad.image}"
              alt="${escapeHtml(ad.title)}"
            >

          `
          : `

            <span class="demo-emoji">
              ${ad.emoji}
            </span>

          `;


      return `

        <article
          class="card"
          data-id="${ad.id}">

          <div class="card-image">

            ${image}

            <button
              class="heart ${favorite ? "liked" : ""}"
              type="button"
              onclick="toggleFavorite(event,'${ad.id}')">

              ${favorite ? "♥" : "♡"}

            </button>

          </div>


          <div class="card-body">

            <div class="tag">
              ${escapeHtml(category)}
            </div>


            <h3>
              ${escapeHtml(ad.title)}
            </h3>


            <p>
              ⌖ ${escapeHtml(ad.city)}
            </p>


            <strong>

              ${escapeHtml(ad.price)}

              <small>
                / ${getPeriod(ad.period)}
              </small>

            </strong>

          </div>

        </article>

      `;

    }).join("");

}


/* =====================================================
   LANGUAGE BUTTON
===================================================== */

document
  .getElementById("langBtn")
  .onclick = function() {

    currentLang =
      currentLang === "fr"
        ? "ar"
        : "fr";


    localStorage.setItem(
      "dabberLang",
      currentLang
    );


    applyLanguage();

  };


/* =====================================================
   SEARCH
===================================================== */

document
  .getElementById("searchBtn")
  .onclick = function() {

    const value =
      document.getElementById("searchInput").value;


    renderListings(value);


    document
      .querySelector(".listings-section")
      .scrollIntoView({
        behavior: "smooth"
      });

  };


document
  .getElementById("searchInput")
  .addEventListener(
    "keydown",
    function(event) {

      if (event.key === "Enter") {

        renderListings(
          event.target.value
        );

      }

    }
  );


/* =====================================================
   CATEGORY CLICK
===================================================== */

document.addEventListener(
  "click",
  function(event) {

    const category =
      event.target.closest(".cat");


    if (!category) return;


    const value =
      category.dataset.search;


    document.getElementById(
      "searchInput"
    ).value = value;


    renderListings(value);


    document
      .querySelector(".listings-section")
      .scrollIntoView({
        behavior: "smooth"
      });

  }
);


/* =====================================================
   ADD ANNOUNCEMENT
===================================================== */

document
  .getElementById("addBtn")
  .onclick = function() {

    window.location.href =
      "ajouter.html";

  };


/* =====================================================
   BOTTOM SEARCH
===================================================== */

document
  .getElementById("bottomSearch")
  .onclick = function() {

    const input =
      document.getElementById("searchInput");


    input.focus();


    window.scrollTo({

      top: 0,

      behavior: "smooth"

    });

  };


/* =====================================================
   HOME
===================================================== */

document
  .getElementById("homeBtn")
  .onclick = function() {

    document.getElementById(
      "searchInput"
    ).value = "";


    renderListings();


    window.scrollTo({

      top: 0,

      behavior: "smooth"

    });

  };


/* =====================================================
   SHOW ALL
===================================================== */

document
  .getElementById("showAll")
  .onclick = function() {

    document.getElementById(
      "searchInput"
    ).value = "";


    renderListings();


    document
      .querySelector(".listings-section")
      .scrollIntoView({
        behavior: "smooth"
      });

  };


document
  .getElementById("seeCategories")
  .onclick = function() {

    document
      .querySelector(".categories")
      .scrollIntoView({
        behavior: "smooth"
      });

  };


/* =====================================================
   FAVORITES
===================================================== */

document
  .getElementById("favoritesBtn")
  .onclick = function() {

    const favorites =
      getFavorites();


    const all =
      getAllListings();


    const results =
      all.filter(ad =>
        favorites.includes(
          String(ad.id)
        )
      );


    const box =
      document.getElementById("listings");


    if (!results.length) {

      box.innerHTML = `

        <div class="empty">

          ${
            currentLang === "fr"
            ? "Vous n'avez pas encore de favoris ❤️"
            : "ما عندك حتى إعلان في المفضلة ❤️"
          }

        </div>

      `;

    } else {

      box.innerHTML =
        results.map(ad => {

          const category =
            currentLang === "fr"
              ? ad.category
              : ad.categoryAr;


          const image =
            ad.image
              ? `<img src="${ad.image}" alt="">`
              : `<span class="demo-emoji">${ad.emoji}</span>`;


          return `

            <article class="card">

              <div class="card-image">

                ${image}

                <button
                  class="heart liked"
                  type="button"
                  onclick="toggleFavorite(event,'${ad.id}')">

                  ♥

                </button>

              </div>


              <div class="card-body">

                <div class="tag">
                  ${escapeHtml(category)}
                </div>

                <h3>
                  ${escapeHtml(ad.title)}
                </h3>

                <p>
                  ⌖ ${escapeHtml(ad.city)}
                </p>

                <strong>
                  ${escapeHtml(ad.price)}
                </strong>

              </div>

            </article>

          `;

        }).join("");

    }


    document
      .querySelector(".listings-section")
      .scrollIntoView({
        behavior: "smooth"
      });

  };


/* =====================================================
   ACCOUNT
===================================================== */

document
  .getElementById("accountBtn")
  .onclick = function() {

    alert(

      currentLang === "fr"

        ? "La page du compte sera ajoutée prochainement 👤"

        : "صفحة الحساب سنضيفها قريبًا 👤"

    );

  };


/* =====================================================
   PWA INSTALL
===================================================== */

let deferredPrompt = null;


window.addEventListener(
  "beforeinstallprompt",
  function(event) {

    event.preventDefault();


    deferredPrompt =
      event;


    document
      .getElementById("installBox")
      .classList
      .remove("hidden");

  }
);


document
  .getEle
